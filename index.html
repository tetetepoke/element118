<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ELEMENT 118" />
    <meta name="theme-color" content="#14182a" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=2" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png?v=2" />
    <title>ELEMENT 118</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #14182a; overflow: hidden;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
        overscroll-behavior: none; }
      /* no padding on the Phaser parent: Phaser measures the box including padding, which pushed the canvas off-screen */
      #game { position: fixed; top: env(safe-area-inset-top); right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); overflow: hidden; touch-action: none; }
      #game canvas { touch-action: none; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #14182a; color: #fff;
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
        align-items: center; justify-content: center; flex-direction: column; text-align: center; gap: 16px; font-size: 20px; }
      #rotate .phone { width: 48px; height: 84px; border: 4px solid #8fd3ff; border-radius: 10px; animation: rot 1.6s ease-in-out infinite; }
      @keyframes rot { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div><div>横にしてね</div><div style="font-size:14px;opacity:.7">iPhoneを横向きにすると遊べます</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
